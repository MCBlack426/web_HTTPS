<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学校后台登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #e8eaed;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .card {
    width: 380px;
    background: #fff;
    border-radius: 6px;
    box-shadow: 0 2px 12px rgba(0,0,0,.12);
    padding: 32px 28px;
  }

  .title {
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 28px;
    color: #333;
  }

  .field { margin-bottom: 20px; }

  .field label {
    display: block;
    font-size: 14px;
    color: #555;
    margin-bottom: 8px;
  }

  .field input {
    width: 100%;
    height: 40px;
    padding: 0 12px;
    font-size: 14px;
    border: 1px solid #999;
    border-radius: 3px;
    outline: none;
  }

  .field input:focus { border-color: #2b7cf6; }

  .btn {
    width: 100%;
    height: 42px;
    margin-top: 8px;
    border: none;
    border-radius: 3px;
    background: #2b7cf6;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }

  .btn:hover { background: #1e6ae0; }

  /* 密码框下方的小提示 */
  .hint {
    margin-top: 10px;
    text-align: center;
    font-size: 12px;
    color: #c0392b;
    visibility: hidden;
  }
  .hint.show { visibility: visible; }
</style>
</head>
<body>

  <div class="card">
    <div class="title">学校后台登录</div>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="account">请输入登录账号</label>
        <input type="text" id="account" name="account" placeholder="">
      </div>

      <div class="field">
        <label for="password">请输入登录密码</label>
        <input type="password" id="password" name="password">
        <div class="hint" id="hint">密码过长</div>
      </div>

      <button type="submit" class="btn">确认登录</button>
    </form>
  </div>

<script>
  // 正确的账号密码
  const CORRECT_ACCOUNT = 'teacher2026';
  const CORRECT_PASSWORD = 'secret123456';

  const CORRECT_ACCOUNT_2 = 'teacher123456';
  const CORRECT_PASSWORD_2 = 'secret2026';

  const pwd = document.getElementById('password');
  const hint = document.getElementById('hint');

  // 输入满 16 位时隐藏提示
  pwd.addEventListener('input', () => {
    hint.classList.toggle('show', pwd.value.length >= 16);
  });

  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();

    const account = document.getElementById('account').value.trim();
    const password = pwd.value;

    if (account === CORRECT_ACCOUNT && password === CORRECT_PASSWORD) {
      // 登录成功，跳转到学校后台
      alert('登录成功！正在跳转学校后台...');
      window.location.href = 'admin_backend.html';
    } else {
      if (account === CORRECT_ACCOUNT_2 && password === CORRECT_PASSWORD_2) {
        // 登录成功，跳转到教学后台
        alert('登录成功！正在跳转教学后台...');
        window.location.href = 'python_java_teaching.html';
      } else {
        // 登录失败，弹窗提示
        alert('账户名或密码错误');
      }

    }

  });
</script>

</body>
</html>
